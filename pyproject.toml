[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-beam"
version = "0.1.0"
description = "Trust-and-memory gate for autonomous accelerator agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "httpx>=0.26",
  "pytest>=7.4",
  "jax>=0.4.20",
  "jaxlib>=0.4.20",
]

[tool.setuptools.packages.find]
where = ["backend"]
