<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc">
  <title id="title">Ghost Beam system architecture</title>
  <desc id="desc">Flow from user or optimizer through UI, backend, experiment runner, diagnostics, policy gate, and evidence artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071017"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#0f4c81"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0" stop-color="#8a5a12"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .panel{fill:rgba(15,23,42,.86);stroke:#334155;stroke-width:1.4}
      .card{fill:#111827;stroke:#475569;stroke-width:1.3}
      .green{fill:url(#green);stroke:#86efac}
      .blue{fill:url(#blue);stroke:#7dd3fc}
      .amber{fill:url(#amber);stroke:#fbbf24}
      .title{font:700 28px Arial, sans-serif;fill:#f8fafc}
      .label{font:700 17px Arial, sans-serif;fill:#f8fafc}
      .small{font:500 13px Arial, sans-serif;fill:#cbd5e1}
      .tiny{font:600 12px Arial, sans-serif;fill:#94a3b8}
      .line{fill:none;stroke:#7dd3fc;stroke-width:2.3;marker-end:url(#arrow)}
      .softline{fill:none;stroke:#86efac;stroke-width:2;marker-end:url(#arrow);opacity:.85}
    </style>
  </defs>
  <rect width="1240" height="620" rx="24" fill="url(#bg)"/>
  <text x="42" y="52" class="title">Ghost Beam System Architecture</text>
  <text x="42" y="78" class="small">Trust-and-memory gate between autonomous proposals and simulated accelerator actions.</text>

  <rect x="42" y="130" width="170" height="82" rx="16" class="blue"/>
  <text x="127" y="162" text-anchor="middle" class="label">User /</text>
  <text x="127" y="186" text-anchor="middle" class="label">Optimizer</text>

  <rect x="272" y="130" width="190" height="82" rx="16" class="card"/>
  <text x="367" y="162" text-anchor="middle" class="label">Ghost Beam UI</text>
  <text x="367" y="185" text-anchor="middle" class="small">React + R3F twin</text>

  <rect x="522" y="130" width="190" height="82" rx="16" class="card"/>
  <text x="617" y="162" text-anchor="middle" class="label">FastAPI</text>
  <text x="617" y="185" text-anchor="middle" class="small">local backend</text>

  <rect x="772" y="112" width="220" height="118" rx="18" class="green"/>
  <text x="882" y="154" text-anchor="middle" class="label">Stateful</text>
  <text x="882" y="178" text-anchor="middle" class="label">Experiment Runner</text>
  <text x="882" y="204" text-anchor="middle" class="small">session + scenario state</text>

  <path d="M212 171 H272" class="line"/>
  <path d="M462 171 H522" class="line"/>
  <path d="M712 171 H772" class="line"/>

  <rect x="70" y="330" width="200" height="86" rx="16" class="panel"/>
  <text x="170" y="362" text-anchor="middle" class="label">Synthetic JAX</text>
  <text x="170" y="386" text-anchor="middle" class="label">Digital Twin</text>
  <text x="170" y="408" text-anchor="middle" class="tiny">transfer-matrix physics</text>

  <rect x="315" y="330" width="210" height="86" rx="16" class="panel"/>
  <text x="420" y="362" text-anchor="middle" class="label">Virtual Diagnostic</text>
  <text x="420" y="386" text-anchor="middle" class="small">prediction</text>
  <text x="420" y="408" text-anchor="middle" class="tiny">uncertainty + OOD</text>

  <rect x="570" y="330" width="210" height="86" rx="16" class="panel"/>
  <text x="675" y="362" text-anchor="middle" class="label">Beam Profile</text>
  <text x="675" y="386" text-anchor="middle" class="small">vision diagnostic</text>
  <text x="675" y="408" text-anchor="middle" class="tiny">halo + loss signals</text>

  <rect x="825" y="330" width="210" height="86" rx="16" class="panel"/>
  <text x="930" y="362" text-anchor="middle" class="label">Synthetic eLog</text>
  <text x="930" y="386" text-anchor="middle" class="small">memory retrieval</text>
  <text x="930" y="408" text-anchor="middle" class="tiny">TF-IDF evidence</text>

  <rect x="520" y="485" width="220" height="86" rx="18" class="amber"/>
  <text x="630" y="520" text-anchor="middle" class="label">Deterministic</text>
  <text x="630" y="544" text-anchor="middle" class="label">Policy Gate</text>

  <path d="M830 230 C780 270 250 265 170 330" class="softline"/>
  <path d="M865 230 C820 275 480 270 420 330" class="softline"/>
  <path d="M900 230 C870 276 720 280 675 330" class="softline"/>
  <path d="M935 230 C965 275 950 290 930 330" class="softline"/>
  <path d="M170 416 C245 468 420 500 520 526" class="line"/>
  <path d="M420 416 C460 465 515 497 542 516" class="line"/>
  <path d="M675 416 C670 455 650 480 640 485" class="line"/>
  <path d="M930 416 C845 468 772 500 740 526" class="line"/>

  <rect x="840" y="485" width="330" height="86" rx="16" class="card"/>
  <text x="1005" y="516" text-anchor="middle" class="label">Evidence Artifacts</text>
  <text x="1005" y="540" text-anchor="middle" class="small">Decision Record, Diagnosis,</text>
  <text x="1005" y="560" text-anchor="middle" class="small">Mission Report, Evidence Bundle</text>
  <path d="M740 528 H840" class="line"/>
</svg>
