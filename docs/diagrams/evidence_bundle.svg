<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc">
  <title id="title">Ghost Beam evidence bundle composition</title>
  <desc id="desc">Evidence bundle receiving session exports, decision records, diagnosis, mission reports, benchmarks, manifests, schemas, and provenance metadata.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071017"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="bundle" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#064e3b"/>
    </radialGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#86efac"/>
    </marker>
    <style>
      .card{fill:#111827;stroke:#475569;stroke-width:1.4}
      .bundle{fill:url(#bundle);stroke:#86efac;stroke-width:2}
      .title{font:700 28px Arial, sans-serif;fill:#f8fafc}
      .head{font:700 18px Arial, sans-serif;fill:#f8fafc}
      .text{font:500 13px Arial, sans-serif;fill:#cbd5e1}
      .line{fill:none;stroke:#86efac;stroke-width:2.1;marker-end:url(#arrow);opacity:.9}
    </style>
  </defs>
  <rect width="1240" height="620" rx="24" fill="url(#bg)"/>
  <text x="42" y="52" class="title">Evidence Bundle Composition</text>
  <text x="42" y="78" class="text">Every gate decision can be packaged with human and machine-readable provenance.</text>

  <rect x="480" y="230" width="280" height="150" rx="28" class="bundle"/>
  <text x="620" y="290" text-anchor="middle" class="head">Evidence Bundle</text>
  <text x="620" y="318" text-anchor="middle" class="text">audit trail + provenance</text>
  <text x="620" y="342" text-anchor="middle" class="text">local synthetic safety boundary</text>

  <rect x="70" y="125" width="220" height="58" rx="14" class="card"/>
  <text x="180" y="160" text-anchor="middle" class="head">Session Export</text>
  <rect x="70" y="225" width="220" height="58" rx="14" class="card"/>
  <text x="180" y="260" text-anchor="middle" class="head">Decision Record JSON</text>
  <rect x="70" y="325" width="220" height="58" rx="14" class="card"/>
  <text x="180" y="360" text-anchor="middle" class="head">Human Diagnosis</text>
  <rect x="70" y="425" width="220" height="58" rx="14" class="card"/>
  <text x="180" y="460" text-anchor="middle" class="head">Mission Report</text>

  <rect x="950" y="105" width="220" height="58" rx="14" class="card"/>
  <text x="1060" y="140" text-anchor="middle" class="head">Benchmark Result</text>
  <rect x="950" y="205" width="220" height="58" rx="14" class="card"/>
  <text x="1060" y="240" text-anchor="middle" class="head">Synthetic Manifest</text>
  <rect x="950" y="305" width="220" height="58" rx="14" class="card"/>
  <text x="1060" y="340" text-anchor="middle" class="head">Data Source Registry</text>
  <rect x="950" y="405" width="220" height="58" rx="14" class="card"/>
  <text x="1060" y="440" text-anchor="middle" class="head">Public Manifests</text>
  <rect x="950" y="505" width="220" height="58" rx="14" class="card"/>
  <text x="1060" y="540" text-anchor="middle" class="head">RO-Crate + Schemas</text>

  <path d="M290 154 C380 170 440 220 480 260" class="line"/>
  <path d="M290 254 H480" class="line"/>
  <path d="M290 354 C380 350 440 330 480 315" class="line"/>
  <path d="M290 454 C390 430 445 375 490 345" class="line"/>
  <path d="M950 134 C850 150 800 215 760 260" class="line"/>
  <path d="M950 234 C865 245 815 270 760 290" class="line"/>
  <path d="M950 334 C860 330 815 320 760 310" class="line"/>
  <path d="M950 434 C860 420 810 365 750 340" class="line"/>
  <path d="M950 534 C825 500 780 405 735 370" class="line"/>
</svg>
